    ];

    const CONF_ORDER = { "High": 1, "Med-High": 2, "Medium": 3, "Low-Med": 4, "Skip": 5 };

    function parseSeasonAvg(avgStr) {
      const m = avgStr.match(/([\d.]+)p\s*\/\s*([\d.]+)r\s*\/\s*([\d.]+)a/);
      if (!m) return { pts: 0, reb: 0, ast: 0, ra: 0, pra: 0 };
      const pts = parseFloat(m[1]), reb = parseFloat(m[2]), ast = parseFloat(m[3]);
      return { pts, reb, ast, ra: +(reb + ast).toFixed(1), pra: +(pts + reb + ast).toFixed(1) };
    }

    function parseL5Avg(l5Str, season) {
      const slash = l5Str.match(/([\d.]+)p\s*\/\s*([\d.]+)r\s*\/\s*([\d.]+)a/);
      if (slash) {
        const pts = parseFloat(slash[1]), reb = parseFloat(slash[2]), ast = parseFloat(slash[3]);
        return { pts, reb, ast, ra: +(reb + ast).toFixed(1), pra: +(pts + reb + ast).toFixed(1) };
      }
      const nums = l5Str.match(/^\d+(?:,\s*\d+){4}/);
      if (nums) {
        const arr = nums[0].split(",").map(Number);
        const pts = +(arr.reduce((a, b) => a + b, 0) / arr.length).toFixed(1);
        return { ...season, pts, pra: +(pts + season.reb + season.ast).toFixed(1) };
      }
      return { ...season };
    }

    function buildAllProps() {
      const all = [];
      PLAYERS.forEach(p => {
        const season = parseSeasonAvg(p.avg);
        const l5 = parseL5Avg(p.l5, season);
        const opp = TEAMS[p.opp];
        const t = TEAMS[p.team];
        const g = GAMES.find(x => x.id === p.game);
        const parts = p.lines.split("|").map(s => s.trim()).filter(Boolean);
        const isRiskyOut = p.status.includes("Doubtful") || p.status.includes("Q - Rest");

        p.expandedProps = [];

        parts.forEach(part => {
          const m = part.match(/^(PTS|REB|AST|R\+A|PRA)\s+([\d.]+)$/);
          if (!m) return;
          const stat = m[1];
          const line = parseFloat(m[2]);
          const key = `${p.id}-${stat}`;

          const statMap = { "PTS": "pts", "REB": "reb", "AST": "ast", "R+A": "ra", "PRA": "pra" };
          const sk = statMap[stat];
          const sVal = season[sk];
          const lVal = l5[sk];
          let proj = sVal * 0.55 + lVal * 0.45;

          // Matchup & script adjustments
          if (opp.defRk >= 22) proj *= 1.03;
          else if (opp.defRk <= 6) proj *= 0.97;
          if (p.dvpRank >= 22) proj *= 1.03;
          else if (p.dvpRank <= 6) proj *= 0.97;
          if (t.b2b && Math.abs(g.spread) >= 8.5 && (stat === "PTS" || stat === "PRA")) proj *= 0.96;

          const diffPct = line > 0 ? ((proj - line) / line) * 100 : 0;

          let side = "Skip";
          let conf = "Skip";
          let reason = "";

          // Check if this is the player's primary curated Over pick
          const curatedMatch = p.pick.match(/^(PTS|REB|AST|R\+A|PRA)\s+Over\s+([\d.]+)$/);
          if (isRiskyOut) {
            side = "Skip";
            conf = "Skip";
            reason = `${p.status} — wait for active/inactive confirmation.`;
          } else if (curatedMatch && curatedMatch[1] === stat && p.conf !== "Skip") {
            side = "Over";
            conf = p.conf;
            reason = p.note;
          } else if (diffPct >= 14) {
            side = "Over"; conf = "High";
            reason = `Season ${sVal} / L5 ${lVal} sits well above ${line} line (${p.dvp}).`;
          } else if (diffPct >= 8) {
            side = "Over"; conf = "Med-High";
            reason = `Projects ~${proj.toFixed(1)} vs ${line} line; ${opp.defRk >= 18 ? "soft" : "solid"} #${opp.defRk} opp D.`;
          } else if (diffPct >= 3.5) {
            side = "Over"; conf = "Medium";
            reason = `Slight Over lean (${sVal} season / ${lVal} L5 vs ${line}).`;
          } else if (diffPct >= 1.2) {
            side = "Over"; conf = "Low-Med";
            reason = `Marginal Over lean (${proj.toFixed(1)} proj vs ${line}).`;
          } else if (diffPct <= -14) {
            side = "Under"; conf = "High";
            reason = `Line (${line}) is well above Season ${sVal} / L5 ${lVal}${t.b2b ? " on a B2B" : ""}${Math.abs(g.spread) >= 8.5 ? " with blowout risk" : ""}.`;
          } else if (diffPct <= -8) {
            side = "Under"; conf = "Med-High";
            reason = `Projects ~${proj.toFixed(1)} below ${line} line${opp.defRk <= 10 ? ` vs #${opp.defRk} defense` : ""}.`;
          } else if (diffPct <= -3.5) {
            side = "Under"; conf = "Medium";
            reason = `Under lean: Season ${sVal} / L5 ${lVal} trails ${line} line.`;
          } else if (diffPct <= -1.2) {
            side = "Under"; conf = "Low-Med";
            reason = `Slight Under lean (${proj.toFixed(1)} proj vs ${line}).`;
          } else {
            side = "Skip"; conf = "Skip";
            reason = `Coin-flip line (${line}) right at Season ${sVal} / L5 ${lVal}.`;
          }

          const propObj = {
            key,
            playerId: p.id,
            name: p.name,
            team: p.team,
            opp: p.opp,
            game: p.game,
            pos: p.pos,
            status: p.status,
            mpg: p.mpg,
            avg: p.avg,
            l5: p.l5,
            dvp: p.dvp,
            dvpRank: p.dvpRank,
            stat,
            line,
            side,
            conf,
            label: side === "Skip" ? `${stat} ${line} (Pass)` : `${stat} ${side} ${line}`,
            reason,
            sVal,
            lVal
          };
          p.expandedProps.push(propObj);
          all.push(propObj);
        });
      });
      return all;
    }

    const ALL_PROPS = buildAllProps();

    let state = {
      search: "",
      game: "ALL",
      side: "ALL",
      layout: "props",
      stat: "ALL",
      conf: "ALL",
      hideSkips: false,
      noB2b: false,
      sort: "conf",
      view: "props",
      slip: []
    };

    try {
      const saved = localStorage.getItem("nba_whale_slip_v2_20261116");
      if (saved) state.slip = JSON.parse(saved);
    } catch (e) {}

    function saveSlip() {
      try {
        localStorage.setItem("nba_whale_slip_v2_20261116", JSON.stringify(state.slip));
      } catch (e) {}
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    function confBadgeClass(conf) {
      if (conf === "High") return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
      if (conf === "Med-High") return "bg-teal-500/20 text-teal-300 border-teal-500/40";
      if (conf === "Medium") return "bg-amber-500/20 text-amber-300 border-amber-500/40";
      if (conf === "Low-Med") return "bg-slate-700/70 text-slate-300 border-slate-600";
      return "bg-slate-800/80 text-slate-500 border-slate-700/60";
    }

    function sideColorClass(side) {
      if (side === "Over") return "text-emerald-400";
      if (side === "Under") return "text-sky-400";
      return "text-slate-400";
    }

    function defRankColor(rk) {
      if (rk >= 21) return "text-emerald-400";
      if (rk <= 10) return "text-rose-400";
      return "text-amber-300";
    }

    function renderGameTabs() {
      const container = document.getElementById("gameTabs");
      const allBtn = `<button data-game="ALL" class="game-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition ${state.game === "ALL" ? "bg-emerald-500 text-slate-950" : "bg-slate-900 text-slate-300 border border-slate-700/80"}">All (8)</button>`;
      const tabs = GAMES.map(g => `
        <button data-game="${g.id}" class="game-tab shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition ${state.game === g.id ? "bg-emerald-500 text-slate-950" : "bg-slate-900 text-slate-300 border border-slate-700/80"}">${g.id}</button>
      `).join("");
      container.innerHTML = allBtn + tabs;
      container.querySelectorAll(".game-tab").forEach(btn => {
        btn.addEventListener("click", () => {
          state.game = btn.dataset.game;
          render();
        });
      });
    }

    function getFilteredProps() {
      const q = state.search.trim().toLowerCase();
      return ALL_PROPS.filter(pr => {
        if (state.game !== "ALL" && pr.game !== state.game) return false;
        if (state.stat !== "ALL" && pr.stat !== state.stat) return false;
        if (state.side !== "ALL" && pr.side !== state.side) return false;
        if (state.hideSkips && pr.conf === "Skip") return false;
        if (state.conf === "TOP" && pr.conf !== "High" && pr.conf !== "Med-High") return false;
        if (state.conf !== "ALL" && state.conf !== "TOP" && pr.conf !== state.conf) return false;
        if (state.noB2b && TEAMS[pr.team].b2b) return false;
        if (q) {
          const hay = `${pr.name} ${pr.team} ${pr.opp} ${pr.label} ${pr.reason}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (state.sort === "conf") {
          const diff = CONF_ORDER[a.conf] - CONF_ORDER[b.conf];
          if (diff !== 0) return diff;
          return b.dvpRank - a.dvpRank;
        }
        if (state.sort === "pace") {
          return (TEAMS[b.team].pace + TEAMS[b.opp].pace) - (TEAMS[a.team].pace + TEAMS[a.opp].pace);
        }
        if (state.sort === "dvp") {
          return state.side === "Under" ? a.dvpRank - b.dvpRank : b.dvpRank - a.dvpRank;
        }
        if (state.sort === "l5diff") {
          const da = a.line > 0 ? Math.abs(a.lVal - a.line) / a.line : 0;
          const db = b.line > 0 ? Math.abs(b.lVal - b.line) / b.line : 0;
          return db - da;
        }
        if (state.sort === "spread") {
          const ga = Math.abs(GAMES.find(g => g.id === a.game).spread);
          const gb = Math.abs(GAMES.find(g => g.id === b.game).spread);
          return ga - gb;
        }
        return 0;
      });
    }

    function getFilteredPlayers() {
      const q = state.search.trim().toLowerCase();
      return PLAYERS.filter(p => {
        if (state.game !== "ALL" && p.game !== state.game) return false;
        if (state.noB2b && TEAMS[p.team].b2b) return false;
        const matchingProps = p.expandedProps.filter(pr => {
          if (state.stat !== "ALL" && pr.stat !== state.stat) return false;
          if (state.side !== "ALL" && pr.side !== state.side) return false;
          if (state.hideSkips && pr.conf === "Skip") return false;
          if (state.conf === "TOP" && pr.conf !== "High" && pr.conf !== "Med-High") return false;
          if (state.conf !== "ALL" && state.conf !== "TOP" && pr.conf !== state.conf) return false;
          return true;
        });
        if (matchingProps.length === 0) return false;
        if (q) {
          const hay = `${p.name} ${p.team} ${p.opp} ${p.note} ${p.lines}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }).sort((a, b) => {
        if (state.sort === "conf") {
          const bestA = Math.min(...a.expandedProps.map(x => CONF_ORDER[x.conf]));
          const bestB = Math.min(...b.expandedProps.map(x => CONF_ORDER[x.conf]));
          if (bestA !== bestB) return bestA - bestB;
          return b.dvpRank - a.dvpRank;
        }
        if (state.sort === "pace") {
          return (TEAMS[b.team].pace + TEAMS[b.opp].pace) - (TEAMS[a.team].pace + TEAMS[a.opp].pace);
        }
        if (state.sort === "dvp") {
          return b.dvpRank - a.dvpRank;
        }
        if (state.sort === "spread") {
          return Math.abs(GAMES.find(g => g.id === a.game).spread) - Math.abs(GAMES.find(g => g.id === b.game).spread);
        }
        return 0;
      });
    }

    function buildGameBanner() {
      if (state.game === "ALL") return "";
      const g = GAMES.find(x => x.id === state.game);
      const away = TEAMS[g.away];
      const home = TEAMS[g.home];
      return `
        <div class="bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3.5">

                <div>

    function injBadge(status) {
      if (status === "OUT") return "bg-rose-500/20 text-rose-300 border-rose-500/40";
      if (status === "Doubtful") return "bg-orange-500/20 text-orange-300 border-orange-500/40";
      if (status === "Questionable") return "bg-amber-500/20 text-amber-300 border-amber-500/40";
      if (status === "Available") return "bg-emerald-500/20 text-emerald-300 border-emerald-500/40";
      return "bg-slate-700/60 text-slate-300 border-slate-600";
    }

    function renderInjuries() {
      const container = document.getElementById("injuriesView");
      document.getElementById("resultsMeta").innerHTML = `<span>Official NBA Injury Report (Nov 16, 2:30 PM ET) • All 8 Games</span>`;
      container.innerHTML = INJURIES.map(item => {
        const g = GAMES.find(x => x.id === item.game);

                <div class="flex items-start justify-between gap-2 text-[11px]">

            </div>
          </div>
        `;
        return `
          <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-3.5">

              <span class="text-xs font-bold text-emerald-400">${g.spreadLabel} | O/U ${g.total}</span>
            </div>

              ${renderTeamList(item.awayTeam, item.awayList)}
              ${renderTeamList(item.homeTeam, item.homeList)}

            <div class="bg-emerald-500/10 border border-emerald-500/25 rounded-xl px-3 py-2 text-[11px] text-emerald-200 mb-2.5">
              <strong class="text-emerald-400">Who Benefits:</strong> ${item.beneficiaries}
            </div>
            <button data-jump-game="${item.game}" class="jump-inj-game-btn w-full py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-emerald-300 font-bold text-xs transition">View ${item.game} Props →</button>
          </div>

      container.querySelectorAll(".jump-inj-game-btn").forEach(btn => {

        });
      });

    function toggleSlip(key) {
      if (state.slip.includes(key)) {
        state.slip = state.slip.filter(x => x !== key);
        showToast("Removed from slip");
      } else {
        state.slip.push(key);
        showToast("Added prop to slip");
      }
      saveSlip();
      updateSlipBar();
      renderProps();
    }

    function updateSlipBar() {
      const count = state.slip.length;
      document.getElementById("slipCountBadge").textContent = count;
      const sub = document.getElementById("slipSubtext");
      if (count === 0) {
        sub.textContent = "Tap + Slip on any Over or Under to build";
      } else {
        const names = state.slip.map(key => {
          const pr = ALL_PROPS.find(x => x.key === key);
          if (!pr) return "";
          const last = pr.name.split(" ").slice(-1)[0];
          const sChar = pr.side === "Over" ? "O" : "U";
          return `${last} ${pr.stat} ${sChar}${pr.line}`;
        }).filter(Boolean).join(" • ");
        sub.textContent = names;
      }
    }

    function renderSlipModal() {
      const list = document.getElementById("slipList");
      if (state.slip.length === 0) {
        list.innerHTML = `<div class="text-center text-xs text-slate-400 py-8">Your slip is empty. Tap <strong>+ Slip</strong> on any Over or Under prop to add it.</div>`;
        return;
      }
      list.innerHTML = state.slip.map(key => {
        const pr = ALL_PROPS.find(x => x.key === key);
        if (!pr) return "";
        const g = GAMES.find(x => x.id === pr.game);
        const t = TEAMS[pr.team];
        return `
          <div class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 flex items-start justify-between gap-2">
            <div>
              <div class="text-xs font-extrabold text-white">${pr.name} (${pr.team}) — <span class="${sideColorClass(pr.side)}">${pr.label}</span></div>
              <div class="text-[11px] text-slate-400 mt-0.5">${pr.game} • ${g.spreadLabel} • ${t.rest} • ${pr.conf}</div>
              <div class="text-[11px] text-slate-300 mt-1">${pr.dvp}</div>
            </div>
            <button data-remove-key="${pr.key}" class="remove-slip-btn px-2 py-1 rounded-lg bg-slate-800 text-slate-400 hover:text-rose-400 text-xs font-bold">✕</button>
          </div>
        `;
      }).join("");

      list.querySelectorAll(".remove-slip-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const key = btn.dataset.removeKey;
          state.slip = state.slip.filter(x => x !== key);
          saveSlip();
          updateSlipBar();
          renderSlipModal();
          renderProps();
        });
      });
    }

    function copySlipText() {
      if (state.slip.length === 0) {
        showToast("Slip is empty");
        return;
      }
      const lines = state.slip.map((key, idx) => {
        const pr = ALL_PROPS.find(x => x.key === key);
        return pr ? `${idx + 1}. ${pr.name} (${pr.team} vs ${pr.opp}) — ${pr.label} [${pr.conf}]` : "";
      }).filter(Boolean);
      const text = `ATL Picks Prop Slip (Nov 16):
` + lines.join("\n");

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast("Slip copied!")).catch(() => fallbackCopy(text));
      } else {
        fallbackCopy(text);
      }
    }

    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand("copy");
        showToast("Slip copied!");
      } catch (e) {
        showToast("Copy failed");
      }
      document.body.removeChild(ta);
    }

      renderGameTabs();
      updateSlipBar();

      const propsBtn = document.getElementById("viewToggleProps");
      const matchBtn = document.getElementById("viewToggleMatchups");
      const injBtn = document.getElementById("viewToggleInjuries");
      const propsFeed = document.getElementById("propsFeed");
      const matchView = document.getElementById("matchupsView");
      const injView = document.getElementById("injuriesView");
      const subFilters = document.getElementById("subFilters");
      const gameTabs = document.getElementById("gameTabs");

      const activeCls = "px-2 py-1.5 rounded-lg text-xs font-semibold bg-emerald-500 text-slate-950 transition";
      const idleCls = "px-2 py-1.5 rounded-lg text-xs font-semibold bg-slate-800 text-slate-300 hover:bg-slate-700 transition";

      propsBtn.className = state.view === "props" ? activeCls : idleCls;
      matchBtn.className = state.view === "matchups" ? activeCls : idleCls;
      injBtn.className = state.view === "injuries" ? activeCls : idleCls;

      propsFeed.classList.toggle("hidden", state.view !== "props");
      matchView.classList.toggle("hidden", state.view !== "matchups");
      injView.classList.toggle("hidden", state.view !== "injuries");
      subFilters.classList.toggle("hidden", state.view !== "props");
      gameTabs.classList.toggle("hidden", state.view !== "props");

      if (state.view === "props") renderProps();
      else if (state.view === "matchups") renderMatchups();
      else renderInjuries();
    }

    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    searchInput.addEventListener("input", (e) => {
      state.search = e.target.value;
      clearSearchBtn.classList.toggle("hidden", !state.search);
      renderProps();
    });
    clearSearchBtn.addEventListener("click", () => {
      state.search = "";
      searchInput.value = "";
      clearSearchBtn.classList.add("hidden");
      renderProps();
    });

    document.getElementById("hideSkipsBtn").addEventListener("click", (e) => {
      state.hideSkips = !state.hideSkips;
      e.target.className = state.hideSkips
        ? "shrink-0 px-2.5 py-2 rounded-xl text-xs font-semibold border border-emerald-500 bg-emerald-500/20 text-emerald-300 transition"
        : "shrink-0 px-2.5 py-2 rounded-xl text-xs font-semibold border border-slate-700 bg-slate-900 text-slate-300 transition";
      renderProps();
    });

    document.getElementById("noB2bBtn").addEventListener("click", (e) => {
      state.noB2b = !state.noB2b;
      e.target.className = state.noB2b
        ? "shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium border border-emerald-500 bg-emerald-500/20 text-emerald-300 transition"
        : "shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-medium border border-slate-700/80 bg-slate-900 text-slate-300 transition";
      renderProps();
    });

    document.getElementById("sideFilter").addEventListener("change", (e) => {
      state.side = e.target.value;
      renderProps();
    });
    document.getElementById("layoutSelect").addEventListener("change", (e) => {
      state.layout = e.target.value;
      renderProps();
    });
    document.getElementById("statFilter").addEventListener("change", (e) => {
      state.stat = e.target.value;
      renderProps();
    });
    document.getElementById("confFilter").addEventListener("change", (e) => {
      state.conf = e.target.value;
      renderProps();
    });
    document.getElementById("sortSelect").addEventListener("change", (e) => {
      state.sort = e.target.value;
      renderProps();
    });

    document.getElementById("viewToggleProps").addEventListener("click", () => {
      state.view = "props";
      render();
    });
    document.getElementById("viewToggleMatchups").addEventListener("click", () => {
      state.view = "matchups";
      render();
    });
    document.getElementById("viewToggleInjuries").addEventListener("click", () => {
      state.view = "injuries";
      render();
    });

    document.getElementById("openSlipBtn").addEventListener("click", () => {
      renderSlipModal();
      document.getElementById("slipModal").classList.remove("hidden");
    });
    document.getElementById("closeSlipBtn").addEventListener("click", () => {
      document.getElementById("slipModal").classList.add("hidden");
    });
    document.getElementById("clearSlipBtn").addEventListener("click", () => {
      state.slip = [];
      saveSlip();
      updateSlipBar();
      renderSlipModal();
      renderProps();
    });
    document.getElementById("copySlipBtn").addEventListener("click", copySlipText);

    render();
  </script>
</body>
</html>
